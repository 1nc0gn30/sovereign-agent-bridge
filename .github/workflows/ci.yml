name: CI

on:
  push:
    branches: [ main, master, dev, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Pytest Test Suite
        run: |
          pytest --cov=sovereign_agent_bridge --cov-report=term-missing --cov-report=xml

      - name: Verify Zero-Dependency Core
        shell: bash
        run: |
          python -c "
          import sys
          import sovereign_agent_bridge
          import sovereign_agent_bridge.compat
          import sovereign_agent_bridge.ui_server
          print('Successfully imported core modules with Python stdlib only!')
          "
